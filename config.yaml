# ============================================================================
#  קובץ ההגדרות היחיד של הפרוייקט.
#  לשנות כאן — לא בקוד. כל ערך שמושמט חוזר לברירת המחדל שב-gurufocus/config.py
# ============================================================================

# ═══════════════════════════════════════════════════════════════════════════
#  ⬇⬇⬇  זה מה שמשנים ביום-יום: טיקרים ותאריכים  ⬇⬇⬇
# ═══════════════════════════════════════════════════════════════════════════

# רשימת הטיקרים. שורה אחת לכל טיקר, עם מקף לפני.
#tickers:
  #- AAPL
  #- MSFT
  #- NVDA
  # - JNJ
tickers: ["NVDA"]
# "quarterly" או "annually".
# ⚠️ שם התקופה השנתית ב-API הוא annually (ולא annuals).
period: quarterly

# ---------------------------------------------------------------------------
# טווח התאריכים. הסינון הוא על *תאריך סוף התקופה* (fiscal_period_end_date),
# לא על תאריך הדיווח.
#
#   start_date: "1950-01-01"   -> הכל, מהתקופה הראשונה שקיימת
#   start_date: "2015-01-01"   -> רק מ-2015 ואילך
#   end_date:   ""             -> עד התקופה האחרונה שקיימת (ברירת מחדל)
#   end_date:   "2024-12-31"   -> עוצר בסוף 2024
#
# שימו לב: ממוצע IC_RAW ו-ROIC דורשים את יתרת סוף הרבעון הקודם.
# אם תחתכו ב-start_date, הרבעון הראשון בטווח ייצא ללא ממוצעים וללא יחסים אלה.
# ---------------------------------------------------------------------------
start_date: "2000-01-01"
end_date: ""

# ---------------------------------------------------------------------------
# עלות ההון (WACC). זה המקום היחיד שבו נקבעים Rf ו-ERP.
#
#   Re = Rf + ERP        ללא CAPM וללא בטא
#
# ⚠️ שברים עשרוניים ולא אחוזים: 4.25% נכתב 0.0425 ולא 4.25.
#    ערך גדול מ-1 ייעצר בשגיאה ולא ייצור WACC של 725% בשקט.
#
# שני הערכים נכתבים גם כעמודות בכל שורה באקסל, כך שאפשר להשוות שתי ריצות
# ולראות מיד אם ההפרש נובע מהנתונים או מההנחה.
# ---------------------------------------------------------------------------
wacc:
  # הריבית חסרת הסיכון
  risk_free_rate: 0.05
  # פרמיית הסיכון של שוק המניות
  equity_risk_premium: 0.03
  
# ═══════════════════════════════════════════════════════════════════════════
#  ⬇⬇⬇  מכאן והלאה — הגדרות שבדרך כלל לא נוגעים בהן  ⬇⬇⬇
# ═══════════════════════════════════════════════════════════════════════════

# --- מקורות נתונים --------------------------------------------------------
# מתבצעת בקשה ל-profile לקבלת sector ו-industry לכל טיקר.
# מתבצעת בקשה ל-valuations לקבלת שווי שוק, מכפיל EV/FCF, מספר מניות,
# מחיר מניה ויחס חוב להון לכל רבעון זמין.


# --- רשת ומטמון -----------------------------------------------------------
network:
  timeout_seconds: 60
  max_retries: 3
  # השהייה בין טיקרים, לריסון קצב מול ה-API
  sleep_between_tickers: 0.3

cache:
  # שמירת ה-JSON הגולמי לדיסק. חוסך בקשות API בזמן פיתוח וריצות חוזרות.
  enabled: true
  directory: data/raw
  # תוקף המטמון בשעות. 0 = לעולם לא לפוג.
  ttl_hours: 24

# --- פלט ------------------------------------------------------------------
output:
  directory: output
  # excel / csv / parquet — אפשר כמה
  formats:
    - excel
    - csv

# --- יישור תקופות ---------------------------------------------------------
# מסיטים את סוף התקופה אחורה ב-N חודשים ולוקחים את הרבעון הקלנדרי של התוצאה.
# כך כל רבעון פיסקלי משויך לרבעון הקלנדרי של החודש הראשון שהוא מכסה:
#   30/09 -> יולי  -> Q3     |  31/12 -> אוקטובר -> Q4  |  31/03 -> ינואר -> Q1
alignment:
  quarter_shift_months: 2

# --- ספי מהותיות לפירוק ROIC / NOPAT --------------------------------------
# תרומה נחשבת ניטרלית, ושינוי נחשב יציב, כשהערך המוחלט שלו אינו עולה על הסף.
# הסף לכל שורה הוא max(absolute, relative * scale) — ראו את ה-docstring של
# DecompositionTolerance ב-gurufocus/decomposition.py.
#
# להשוואה ישירה לאפס אין משמעות כאן: רעש של נקודה צפה היה מסווג שגיאת עיגול
# כאפקט כלכלי אמיתי.
decomposition:
  # ROIC אחרי מס הוא יחס, ולכן הסף מוחלט: 1e-4 = 10 נקודות בסיס.
  roic_absolute: 0.0001
  roic_relative: 0.001
  # NOPAT הוא סכום כספי, ולכן הסף יחסי: 0.5% מהרבעון הגדול מבין השניים.
  nopat_absolute: 0.000000001
  nopat_relative: 0.005
  # תנועה גולמית של EBIT ושל ההון המושקע.
  amount_absolute: 0.000000001
  amount_relative: 0.005
  # תנועה גולמית של שיעור המס — נקודת בסיס אחת.
  rate_absolute: 0.0001
  rate_relative: 0.001
  # מעבר רווח/הפסד/אפס. כמעט מדויק במכוון: "EBIT אפס" הוא קביעה על הערך
  # המדווח, לא על מהותיות.
  level_absolute: 0.000000001
  level_relative: 0.000000001
  # שני גורמים נחשבים BALANCED כששיעורי התרומה המוחלטת שלהם קרובים
  # עד כדי חמש נקודות אחוז.
  dominance: 0.05
