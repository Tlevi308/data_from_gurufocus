# ============================================================================
#  קובץ ההגדרות היחיד של הפרוייקט.
#  לשנות כאן — לא בקוד. כל ערך שמושמט חוזר לברירת המחדל שב-gurufocus/config.py
# ============================================================================

# ═══════════════════════════════════════════════════════════════════════════
#  ⬇⬇⬇  זה מה שמשנים ביום-יום: טיקרים ותאריכים  ⬇⬇⬇
# ═══════════════════════════════════════════════════════════════════════════

# רשימת הטיקרים. שורה אחת לכל טיקר, עם מקף לפני.
tickers:
  - AAPL
  # - MSFT
  # - JNJ

# "quarterly" או "annually".
# ⚠️ שם התקופה השנתית ב-API הוא annually (ולא annuals).
period: quarterly

# ---------------------------------------------------------------------------
# טווח התאריכים. הסינון הוא על *תאריך סוף התקופה* (fiscal_period_end_date),
# לא על תאריך הדיווח.
#
#   start_date: "1950-01-01"   -> הכל, מהתקופה הראשונה שקיימת
#   start_date: "2015-01-01"   -> רק מ-2015 ואילך
#   end_date:   ""             -> עד התקופה האחרונה שקיימת (ברירת מחדל)
#   end_date:   "2024-12-31"   -> עוצר בסוף 2024
#
# שימו לב: ממוצע IC_RAW ו-ROIC דורשים את יתרת סוף הרבעון הקודם.
# אם תחתכו ב-start_date, הרבעון הראשון בטווח ייצא ללא ממוצעים וללא יחסים אלה.
# ---------------------------------------------------------------------------
start_date: "2000-01-01"
end_date: ""

# ═══════════════════════════════════════════════════════════════════════════
#  ⬇⬇⬇  מכאן והלאה — הגדרות שבדרך כלל לא נוגעים בהן  ⬇⬇⬇
# ═══════════════════════════════════════════════════════════════════════════

# --- מקורות נתונים --------------------------------------------------------
# מתבצעת בקשה ל-valuations לקבלת שווי שוק, מכפיל EV/FCF, מספר מניות,
# מחיר מניה ויחס חוב להון לכל רבעון זמין.

# --- רשת ומטמון -----------------------------------------------------------
network:
  timeout_seconds: 60
  max_retries: 3
  # השהייה בין טיקרים, לריסון קצב מול ה-API
  sleep_between_tickers: 0.3

cache:
  # שמירת ה-JSON הגולמי לדיסק. חוסך בקשות API בזמן פיתוח וריצות חוזרות.
  enabled: true
  directory: data/raw
  # תוקף המטמון בשעות. 0 = לעולם לא לפוג.
  ttl_hours: 24

# --- פלט ------------------------------------------------------------------
output:
  directory: output
  # excel / csv / parquet — אפשר כמה
  formats:
    - excel
    - csv

# --- יישור תקופות ---------------------------------------------------------
# מסיטים את סוף התקופה אחורה ב-N חודשים ולוקחים את הרבעון הקלנדרי של התוצאה.
# כך כל רבעון פיסקלי משויך לרבעון הקלנדרי של החודש הראשון שהוא מכסה:
#   30/09 -> יולי  -> Q3     |  31/12 -> אוקטובר -> Q4  |  31/03 -> ינואר -> Q1
alignment:
  quarter_shift_months: 2
